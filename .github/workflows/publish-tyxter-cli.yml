name: Publish Tyxter CLI image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tyxter/tyxter-cli

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate release tag and package version
        id: release
        run: node scripts/release-metadata.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf 'Container image: `%s:%s` (linux/amd64 and linux/arm64).\n' \
            "$IMAGE_NAME" "$RELEASE_TAG" > "$notes_file"
          flags=(--latest=false --prerelease)
          if [[ "$STABLE_RELEASE" == "true" ]]; then
            flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tyxter CLI $RELEASE_TAG" --generate-notes \
            --notes-file "$notes_file" "${flags[@]}"
