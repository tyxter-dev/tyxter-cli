name: Validate CLI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@12.2.0
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: npm --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Test the minimum supported Node runtime
        if: matrix.node == '24'
        run: docker run --rm -v "$PWD:/repo" -w /repo node:22.12.0-slim node node_modules/vitest/vitest.mjs run
      - run: pnpm check:package
      - run: pnpm audit
      - run: docker compose --env-file .env.example config --services
      - run: docker compose --env-file .env.example -f compose.image.yaml config --services

  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: tyxter-cli:check
      - run: docker run --rm --platform ${{ matrix.platform }} tyxter-cli:check --version
      - run: docker run --rm --platform ${{ matrix.platform }} tyxter-cli:check help
      - run: docker run --rm --platform ${{ matrix.platform }} tyxter-cli:check status --json
      - name: Scan fixable high and critical image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 tyxter-cli:check
